[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-authoring-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "319caf09d2d4bf884b4f05924e246d9b7890f3ad" }
cranpose-plugin-ux = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "319caf09d2d4bf884b4f05924e246d9b7890f3ad" }
cranpose = { version = "0.1.171", features = ["embed"], git = "https://github.com/samoylenkodmitry/Cranpose", rev = "8fa9ba77b24506d4351ca1fcea255e0ac64099ef" }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "8fa9ba77b24506d4351ca1fcea255e0ac64099ef", version = "0.1.171" }
cranpose-dev-runner = { version = "0.1.0", path = "../dev-runner" }
cranpose-stability = { git = "https://github.com/samoylenkodmitry/cranpose-stability", rev = "16cdf362483f05649f05319d1191b21a6db813e0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
