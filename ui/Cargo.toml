[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "1a7f815d363456b6da19248f2e6213b14d859bd7" }
cranpose-plugin-authoring-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "1a7f815d363456b6da19248f2e6213b14d859bd7" }
cranpose-plugin-ux = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "1a7f815d363456b6da19248f2e6213b14d859bd7" }
cranpose = { version = "0.1.176", features = ["embed"], git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d" }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d", version = "0.1.176" }
cranpose-dev-runner = { version = "0.1.0", path = "../dev-runner" }
cranpose-stability = { git = "https://github.com/samoylenkodmitry/cranpose-stability", rev = "e0a0663a1f1f560fab9657efc986d7658bd12af5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
