[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "405dfac7137fb0fe3bc21eec2a482f87131d8531" }
cranpose-plugin-authoring-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "405dfac7137fb0fe3bc21eec2a482f87131d8531" }
cranpose-plugin-ux = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "405dfac7137fb0fe3bc21eec2a482f87131d8531" }
cranpose-plugin-toolchain = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "405dfac7137fb0fe3bc21eec2a482f87131d8531" }
cranpose = { version = "0.22.4", features = ["embed"] }
cranpose-core = { version = "0.22.4" }
cranpose-dev-runner = { version = "0.1.0", path = "../dev-runner" }
cranpose-stability = { git = "https://github.com/samoylenkodmitry/cranpose-stability", rev = "ec146c0386b1bd91525dc8593b44bfc8f2bd3514" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
