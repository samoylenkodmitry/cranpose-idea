[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-ux = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "24d476d25286e8bc818e4c1c1664bbfceca67c4e" }
cranpose = { version = "0.1.164", features = ["embed"], git = "https://github.com/samoylenkodmitry/Cranpose", rev = "e177b19985c303a13fcf40d61decc7253fdbe057" }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "e177b19985c303a13fcf40d61decc7253fdbe057", version = "0.1.164" }
cranpose-dev-runner = { version = "0.1.0", path = "../dev-runner" }
cranpose-stability = { git = "https://github.com/samoylenkodmitry/cranpose-stability", rev = "a7109ad90e90e725b57a99d8bdf39146e048eed7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
