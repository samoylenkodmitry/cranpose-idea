[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "f7d1073245488bb160b0389609967245285d1637" }
cranpose-plugin-authoring-ui = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "f7d1073245488bb160b0389609967245285d1637" }
cranpose-plugin-ux = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "f7d1073245488bb160b0389609967245285d1637" }
cranpose = { version = "0.1.175", features = ["embed"], git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a49e7a781bfbab626f4ea3f6aadbdc2c1eb3e06b" }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a49e7a781bfbab626f4ea3f6aadbdc2c1eb3e06b", version = "0.1.175" }
cranpose-dev-runner = { version = "0.1.0", path = "../dev-runner" }
cranpose-stability = { git = "https://github.com/samoylenkodmitry/cranpose-stability", rev = "0077cc8bf62874f08298a93a2eabd3adc163e745" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
