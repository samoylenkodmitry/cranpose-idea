[package]
name = "cranpose-dev-runner"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
cranpose-plugin-authoring = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "93602c3151d7815bf6cad5ab732567c3ce6c9a8e" }
cranpose-plugin-cache = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "93602c3151d7815bf6cad5ab732567c3ce6c9a8e" }
cranpose-plugin-process = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "93602c3151d7815bf6cad5ab732567c3ce6c9a8e" }
cranpose-plugin-watch = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "93602c3151d7815bf6cad5ab732567c3ce6c9a8e" }
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
notify = "8.2.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3", features = ["full", "visit-mut"] }
toml_edit = "0.25.15"
walkdir = "2.5.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
