name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Rust host and Cranpose UI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.dylib }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.dylib }
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.so }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.so }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: cranpose-intellij-ui.exe, lib: cranpose_ide_host.dll }
          - { platform: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, exe: cranpose-intellij-ui.exe, lib: cranpose_ide_host.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features -p cranpose-intellij-ui -p cranpose-ide-host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.exe }}
            target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error
  test:
    name: Rust and native IDE integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features --workspace --all-targets --features cranpose-ide-host/ide-tests -- -D warnings
      - run: cargo test --locked --no-default-features --workspace
      - run: cargo run --locked -p xtask -- release audit-source
      - run: cargo run --locked -p xtask -- fetch-ide
      - run: cargo run --locked -p xtask -- ide-test --ide "$CRANPOSE_TEST_IDE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ide-test-evidence
          path: |
            target/ide-tests/**/evidence
            target/ide-tests/**/console.log
            target/ide-tests/**/log
          if-no-files-found: ignore
  hot-reload:
    name: Live code, state and recovery (Rust harness)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p cranpose-dev-runner
      # Generated sources must stay outside rust-cache's pruned target directory.
      - name: Binary application
        run: cargo run --locked -p xtask -- hot-smoke --runner target/debug/cranpose-dev-runner --fixture counter --reuse-fixture --cache "${{ runner.temp }}/cranpose-hot-cache" --log counter-hot-reload.log --measure-rounds 2 --background-noise-ms 1000 --idle-seconds 20 --idle-settle-seconds 5 --profile-startup --build-diagnostics --report counter-hot-reload.json
      - name: Cached support and dependencies on preview restart
        run: cargo run --locked -p xtask -- hot-smoke --runner target/debug/cranpose-dev-runner --fixture counter --reuse-fixture --cache "${{ runner.temp }}/cranpose-hot-cache" --log restart-hot-reload.log --startup-only --restart-rounds 2 --require-isolated-restarts --profile-startup --require-cached-dependencies --require-cached-workspace --build-diagnostics --require-cached-support --report restart-hot-reload.json
      - name: Inspector unchanged and changed layouts
        run: |
          cargo build --locked --no-default-features -p cranpose-intellij-ui
          cargo run --locked -p xtask -- inspection-profile --binary target/debug/cranpose-intellij-ui --nodes 1000 --seconds 5 --settle-seconds 3 --require-quiet --change-rounds 3 --change-seconds 5 --exercise-tree --max-ui-nodes 200 --log inspector-hot-reload.log --report inspector-hot-reload.json
      - name: Library and binary application
        run: cargo run --locked -p xtask -- hot-smoke --runner target/debug/cranpose-dev-runner --fixture library --reuse-fixture --source src/lib.rs --cache "${{ runner.temp }}/cranpose-hot-cache" --log library-hot-reload.log --measure-rounds 2 --profile-startup --report library-hot-reload.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hot-reload-evidence
          path: |
            *-hot-reload.log
            restart-hot-reload.restart-*.log
            *-hot-reload.json
  stability:
    name: Composable stability (sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: samoylenkodmitry/cranpose-stability@a7109ad90e90e725b57a99d8bdf39146e048eed7
        with:
          path: samples/counter
  plugin:
    name: Verified plugin (all platforms)
    needs: [native, test, hot-reload, stability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
      - run: cargo run --locked -p xtask -- package --native-dir native --output "${{ runner.temp }}/cranpose-package"
      - run: cargo run --locked -p xtask -- release check-zip "${{ runner.temp }}/cranpose-package"/cranpose-idea-*.zip
      - run: cargo run --locked -p xtask -- fetch-ide
      - run: cargo run --locked -p xtask -- release verify "${{ runner.temp }}/cranpose-package"/cranpose-idea-*.zip --ide "$CRANPOSE_TEST_IDE"
      - run: cargo run --locked -p xtask -- fetch-ide --product RustRover --version 2026.2.3
      - run: cargo run --locked -p xtask -- release verify "${{ runner.temp }}/cranpose-package"/cranpose-idea-*.zip --ide "$CRANPOSE_TEST_IDE"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/cranpose-package/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: target/verification
          if-no-files-found: ignore
