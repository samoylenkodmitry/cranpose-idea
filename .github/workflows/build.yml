name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: UI binary (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: cranpose-intellij-ui }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, exe: cranpose-intellij-ui }
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: cranpose-intellij-ui }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: cranpose-intellij-ui }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: cranpose-intellij-ui.exe }
          - { platform: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, exe: cranpose-intellij-ui.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features -p cranpose-intellij-ui --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  test:
    name: Tests (IDEA 2026.1, software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features -p cranpose-intellij-ui --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features -p cranpose-intellij-ui
      - run: python3 -m unittest discover -s scripts/tests
      - working-directory: plugin
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-evidence
          path: |
            plugin/build/test-frames
            plugin/build/reports/tests
          if-no-files-found: ignore

  plugin:
    name: Verified plugin (all platforms)
    needs: [native, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
      - run: python3 scripts/release.py arrange-native native
      - working-directory: plugin
        run: ./gradlew buildPlugin verifyPlugin -PcranposeNativeDir="$GITHUB_WORKSPACE/native"
      - run: python3 scripts/release.py check-zip plugin/build/distributions/cranpose-idea-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: plugin/build/reports/pluginVerifier
          if-no-files-found: ignore
