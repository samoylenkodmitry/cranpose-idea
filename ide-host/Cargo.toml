[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "99be740ebe15a2c0b50036a6e90d3bf946f7d8a7", features = ["host-library"] }
jni = "0.21"
