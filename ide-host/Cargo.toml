[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "6d192bb9c1d0246a8baefabba61c28ffcbb00946", features = ["host-library"] }
cranpose-build = { git = "https://github.com/samoylenkodmitry/cranpose-build", rev = "3f97a6610f70f6e6f7a2a31af7391c476ceff4e0", version = "0.3.2" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.22"
