[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "405dfac7137fb0fe3bc21eec2a482f87131d8531", features = ["host-library"] }
cranpose-build = { git = "https://github.com/samoylenkodmitry/cranpose-build", rev = "6afa1f88ff56e95b3e6ed9aa21561e207126c2a9", version = "0.3.3" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
