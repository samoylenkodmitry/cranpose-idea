[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "1b8b7b3c7858836917ecf8a19a59f350e7093988", features = ["host-library"] }
cranpose-build = { git = "https://github.com/samoylenkodmitry/cranpose-build", rev = "9361b03fe58f5c1727a7637b3f5b045dbee42500" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
