[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "c97bb8b90d619bf3bdbe9e85cf917b918d41b164", features = ["host-library"] }
jni = "0.21"
