[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "94fcc46a900fb52a8fa2edfdb8045ab2dc55c24c", features = ["host-library"] }
cranpose-build = { git = "https://github.com/samoylenkodmitry/cranpose-build", rev = "a0a9b0397d29af9d35c588849614c02b5f401abe", version = "0.3.2" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.22"
