[package]
name = "cranpose-ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cranpose Studio configuration of the template's shared Rust IDE host"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
ide-tests = ["cranpose-host/ide-tests"]

[dependencies]
cranpose-host = { package = "cranpose-plugin-host", git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "a8d0cdf14cc2ab13fb593364cb0647fc52be1780", features = ["host-library"] }
cranpose-build = { git = "https://github.com/samoylenkodmitry/cranpose-build", rev = "7bca6365ae2c93e3e6412890da8ff688495e4387" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
